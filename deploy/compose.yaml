name: entitle
services:
  app:
    build:
      context: ..
    restart: unless-stopped
    env_file: ../.env
    environment:
      NODE_ENV: production
      LOCAL_BILLING: "false"
      DATA_DIR: /data
      WORK_DIR: /data/work
      WEB_DIR: /app/web
      PORT: 3211
    volumes:
      # Only the application's own subdirectory: Caddy's ACME private keys live in
      # sibling directories the API must not read. Create app/ owned by UID 1000;
      # a missing directory fails instead of starting with an empty database.
      - type: bind
        source: ${ENTITLE_DATA_DIR:?Set ENTITLE_DATA_DIR to an absolute persistent directory}/app
        target: /data
        bind:
          create_host_path: false
    expose: ["3211"]
    networks:
      default:
        ipv4_address: 172.30.81.3
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: ${ENTITLE_MEMORY_LIMIT:-768m}
  web:
    build:
      context: ..
      dockerfile: deploy/runtime.Dockerfile
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      ENTITLE_API_UPSTREAM: app:3211
      ENTITLE_PUBLIC_HOST: ${ENTITLE_PUBLIC_HOST:?Set the hostname matching PUBLIC_ORIGIN}
      ENTITLE_PUBLIC_SCHEME: https
      ENTITLE_APP_BASE_PATH: ${ENTITLE_APP_BASE_PATH:-/app}
      ENTITLE_TRUSTED_PROXY_CIDRS: 172.30.81.2/32
    volumes:
      - ${ENTITLE_WEB_RELEASE_DIR:?Set an absolute activated frontend release directory}:/releases:ro
    tmpfs:
      - /runtime:uid=101,gid=101,mode=0700
      - /cache:uid=101,gid=101,mode=0700
    expose: ["8080"]
    networks:
      default:
        ipv4_address: 172.30.81.4
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
  proxy:
    image: caddy:2.11.2@sha256:25cdc846626b62d05f6b633b9b40c2c9f6ef89b515dc76133cefd920f7dbe562
    restart: unless-stopped
    depends_on: [web]
    ports: ["80:80", "443:443"]
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN to your HTTPS service origin}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${ENTITLE_DATA_DIR}/caddy-data:/data
      - ${ENTITLE_DATA_DIR}/caddy-config:/config
    networks:
      default:
        ipv4_address: 172.30.81.2
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.81.0/24
